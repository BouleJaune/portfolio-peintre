<footer class="site-footer">
  <div class="site-footer__inner">
    <p class="site-footer__name">{{ site.data.site.artiste }}</p>
    <p class="site-footer__location">{{ site.data.site.localisation }}</p>
    <a href="mailto:{{ site.data.site.email }}" class="site-footer__email">{{ site.data.site.email }}</a>
    <p class="site-footer__copy">© {{ 'now' | date: "%Y" }} — Tous droits réservés</p>
  </div>
</footer>
